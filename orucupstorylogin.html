<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Oru Cup Story</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Full screen background video */
video.bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
}

/* Black slight overlay to make text visible */
.bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(238, 138, 138, 0.35);
    z-index: -1;
}

.card {
    width: 350px;
    margin: 120px auto;
    backdrop-filter: blur(14px);
    background: rgba(235, 161, 171, 0.9);
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

h4, .nav-link, .navbar-brand strong {
    color: #0c0c0c !important;
}

.navbar {
    background: transparent !important;
    backdrop-filter: blur(8px);
}
.nav-link:hover {
    color: #ffd700 !important;
}
</style>
</head>
<body>


<video class="bg-video" autoplay muted loop>
  <source src="" type="video/mp4">
</video>
<div class="bg-overlay"></div>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="https://cdn-icons-png.flaticon.com/512/924/924514.png" width="45" class="me-2">
      <strong>Oru Cup Story</strong>
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="teashop.html">Home</a></li>
    </ul>
  </div>
</nav>

<div class="card shadow p-4 text-dark">
    <h4 class="text-center mb-3">Log In</h4>
    <form>
        <input type="email" class="form-control mb-3" placeholder="Email" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>
        <button class="btn btn-success w-100 mb-3">Log In</button>
        <p class="text-center small mt-2">
           Don't have an account? <a href="register.html" class="fw-bold">Register</a>
        </p>
    </form>
</div>

</body>
</html>
