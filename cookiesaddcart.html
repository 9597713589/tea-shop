<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart | Oru Cup Story</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fffaf3; }
    h2 { color: #5a3e2b; margin-top: 30px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background-color: #f8f1e7; border-radius: 8px; }
    .remove-btn { cursor: pointer; color: red; font-weight: bold; }
    .qty-btn { cursor: pointer; padding: 0 8px; background-color: #ddd; border-radius: 4px; margin: 0 5px; }
    .buy-now-btn { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center">🛒 Your Cart</h2>
    <div id="cartItems" class="my-4"></div>
    <h4>Total: Rs. <span id="totalPrice">0</span></h4>
    <button class="btn btn-primary buy-now-btn" onclick="buyNow()">Buy Now</button>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || {};
    const cartItems = document.getElementById('cartItems');
    const totalPriceEl = document.getElementById('totalPrice');

    function renderCart() {
      cartItems.innerHTML = '';
      let total = 0;

      for (let key in cart) {
        const item = cart[key];
        total += item.price * item.quantity;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <span>${item.name}</span>
          <div>
            <span class="qty-btn" data-name="${item.name}" data-action="decrease">-</span>
            <span>${item.quantity}</span>
            <span class="qty-btn" data-name="${item.name}" data-action="increase">+</span>
          </div>
          <span>Rs. ${item.price * item.quantity} <span class="remove-btn" data-name="${item.name}">&times;</span></span>
        `;
        cartItems.appendChild(div);
      }

      totalPriceEl.textContent = total;

      document.querySelectorAll(".remove-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const name = e.target.getAttribute("data-name");
          delete cart[name];
          localStorage.setItem('cart', JSON.stringify(cart));
          renderCart();
        });
      });

      document.querySelectorAll(".qty-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const name = e.target.getAttribute("data-name");
          const action = e.target.getAttribute("data-action");

          if(action === "increase") {
            cart[name].quantity += 1;
          } else if(action === "decrease") {
            cart[name].quantity -= 1;
            if(cart[name].quantity <= 0) delete cart[name];
          }

          localStorage.setItem('cart', JSON.stringify(cart));
          renderCart();
        });
      });
    }

    function buyNow() {
      if(Object.keys(cart).length === 0) {
        alert("Your cart is empty!");
        return;
      }
      // Navigate to a new checkout page (you can create checkout.html)
      window.location.href = "checkout.html";
    }

    renderCart();
  </script>
</body>
</html>
